<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台密碼總覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c8a96e; --dark:#0a0a0a; --dark2:#141414; --line:rgba(200,169,110,.3); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans TC', sans-serif; background:var(--dark); color:#fff; padding:28px 16px 60px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:26px; font-weight:900; margin-bottom:4px; }
  h1 span { color:var(--gold); }
  .logout { display:inline-block; text-decoration:none; float:right; padding:10px 18px;
    font-size:15px; font-weight:700; color:rgba(255,255,255,.6); background:#1c1c1c; border:1px solid var(--line); border-radius:8px; }
  .hint { color:rgba(255,255,255,.5); font-size:14px; margin:14px 0 24px; }
  table { width:100%; border-collapse:collapse; background:#1c1c1c; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:14px 12px; text-align:left; font-size:15px; border-bottom:1px solid var(--line); }
  th { color:var(--gold); font-size:14px; }
  tr:last-child td { border-bottom:none; }
  a.sitelink { color:#fff; text-decoration:underline; word-break:break-all; }
  .cred { font-family:'SF Mono', Menlo, monospace; background:#0a0a0a; padding:3px 8px; border-radius:5px; }
  .copybtn { margin-left:6px; font-size:12px; padding:3px 8px; border-radius:5px; border:1px solid var(--line);
    background:transparent; color:rgba(255,255,255,.6); cursor:pointer; }
  @media (max-width:700px) {
    table, thead, tbody, th, td, tr { display:block; }
    thead { display:none; }
    tr { margin-bottom:14px; border:1px solid var(--line); border-radius:10px; padding:10px; }
    td { border:none; padding:6px 4px; }
    td::before { content: attr(data-label); display:block; font-size:12px; color:var(--gold); margin-bottom:2px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="logout" href="{{ url_for('vault_logout') }}">登出</a>
    <h1>教練專屬<span>後台密碼總覽</span></h1>
    <div class="hint">任何電腦、任何裝置，用這頁的帳號密碼登入都一樣有效——這不是本機記住的，是伺服器端的帳密。</div>
    <table>
      <thead><tr><th>系統</th><th>網址</th><th>帳號</th><th>密碼</th></tr></thead>
      <tbody>
        {% for e in entries %}
        <tr>
          <td data-label="系統">{{ e.name }}</td>
          <td data-label="網址"><a class="sitelink" href="{{ e.url }}" target="_blank" rel="noopener">{{ e.url }}</a></td>
          <td data-label="帳號"><span class="cred">{{ e.user }}</span></td>
          <td data-label="密碼"><span class="cred">{{ e.password }}</span></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
