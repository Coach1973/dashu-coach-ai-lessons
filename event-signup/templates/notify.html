<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發送通知｜大樹教練活動系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c8a96e; --dark:#0a0a0a; --dark2:#141414; --line:rgba(200,169,110,.3); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans TC', sans-serif; background:var(--dark); color:#fff; padding:28px 16px 60px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:26px; font-weight:900; margin-bottom:4px; }
  h1 span { color:var(--gold); }
  .back { display:inline-block; margin-bottom:20px; color:rgba(255,255,255,.5); text-decoration:none; font-size:15px; }
  label { display:block; font-size:18px; font-weight:700; color:var(--gold); margin:20px 0 8px; }
  select, textarea {
    width:100%; padding:14px; font-size:18px; font-family:inherit; font-weight:500;
    background:#0f0f0f; color:#fff; border:1px solid var(--line); border-radius:10px; outline:none;
  }
  textarea { min-height:140px; resize:vertical; line-height:1.6; }
  select:focus, textarea:focus { border-color:var(--gold); }
  .hint { font-size:15px; color:rgba(255,255,255,.5); margin-top:8px; }
  button {
    width:100%; margin-top:24px; padding:16px; font-size:20px; font-weight:900; font-family:inherit;
    color:var(--dark); background:var(--gold); border:none; border-radius:10px; cursor:pointer; letter-spacing:4px;
  }
  button:hover { filter:brightness(1.12); }
  .result {
    margin-top:24px; padding:18px; border-radius:10px; background:#0f2a1a; border:1px solid rgba(6,199,85,.4);
    font-size:17px; line-height:1.8;
  }
  .result b { color:#06C755; font-size:20px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/admin?key={{ admin_key }}">← 回名單</a>
    <h1>發送通知<span>｜精準分眾</span></h1>

    {% if result %}
    <div class="result">
      這場活動共 <b>{{ result.total }}</b> 位可通知的來賓<br>
      成功送出 <b>{{ result.sent }}</b> 則{% if result.failed %}，失敗 {{ result.failed }} 則{% endif %}
    </div>
    {% endif %}

    <form method="POST">
      <label>選擇活動（只發給參加過這場的人）</label>
      <select name="event" required>
        <option value="">請選擇</option>
        {% for e in events %}
        <option value="{{ e.slug }}">{{ e.name }}（{{ e.event_date or '' }}）— {{ e.line_bound_count or 0 }}/{{ e.signup_count }} 人可通知</option>
        {% endfor %}
      </select>

      <label>訊息內容</label>
      <textarea name="message" placeholder="例：大樹教練提醒您，下次活動 XX月XX日 歡迎再來參加！" required></textarea>
      <p class="hint">只會發給「已加好友＋已傳過問候」的人，人數看上面選單括號裡的比例</p>

      <button type="submit">送出通知</button>
    </form>
  </div>
</body>
</html>
