<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ event.name }}｜活動報到</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c8a96e; --dark:#0a0a0a; --dark2:#141414; --line:rgba(200,169,110,.3); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans TC', sans-serif; background:var(--dark); color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .card {
    width:100%; max-width:440px; background:var(--dark2);
    border:1px solid var(--line); border-radius:16px; padding:36px 28px;
  }
  .eyebrow { color:var(--gold); font-size:15px; font-weight:700; letter-spacing:4px; text-align:center; margin-bottom:10px; }
  h1 { font-size:26px; font-weight:900; text-align:center; line-height:1.4; margin-bottom:6px; }
  .date { text-align:center; color:var(--gold); font-size:18px; font-weight:700; margin-bottom:26px; }
  .hint { font-size:18px; color:rgba(255,255,255,.85); text-align:center; margin-bottom:26px; line-height:1.7; }
  label { display:block; font-size:18px; font-weight:700; color:var(--gold); margin:18px 0 8px; }
  label .opt { color:rgba(255,255,255,.5); font-weight:500; font-size:15px; }
  input {
    width:100%; padding:15px 16px; font-size:19px; font-family:inherit; font-weight:500;
    background:#0f0f0f; color:#fff; border:1px solid var(--line); border-radius:10px; outline:none;
  }
  input:focus { border-color:var(--gold); }
  .error {
    background:rgba(180,50,50,.15); border:1px solid rgba(220,80,80,.6); color:#ff9b9b;
    font-size:18px; font-weight:700; padding:12px 16px; border-radius:10px; margin-bottom:6px; text-align:center;
  }
  button {
    width:100%; margin-top:30px; padding:17px; font-size:21px; font-weight:900; font-family:inherit;
    color:var(--dark); background:var(--gold); border:none; border-radius:10px; cursor:pointer;
    letter-spacing:6px; transition:.25s;
  }
  button:hover { filter:brightness(1.12); transform:translateY(-1px); }
  .foot { text-align:center; color:rgba(255,255,255,.45); font-size:15px; margin-top:22px; line-height:1.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">歡迎蒞臨</div>
    <h1>{{ event.name }}</h1>
    {% if event.event_date %}<div class="date">{{ event.event_date }}</div>{% endif %}
    <p class="hint">留下您的資料<br>未來活動第一時間通知您</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>姓名</label>
      <input type="text" name="name" value="{{ form.get('name','') }}" placeholder="請輸入姓名" required>
      <label>手機</label>
      <input type="tel" name="phone" value="{{ form.get('phone','') }}" placeholder="09xxxxxxxx" required inputmode="numeric">
      <label>公司／職稱 <span class="opt">（選填）</span></label>
      <input type="text" name="company_title" value="{{ form.get('company_title','') }}" placeholder="例：大樹企管｜創辦人">
      <button type="submit">送出</button>
    </form>
    <p class="foot">資料僅用於活動通知，不做其他用途</p>
  </div>
</body>
</html>
