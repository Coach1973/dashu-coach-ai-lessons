<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ event.name }}｜活動簽到</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c8a96e; --dark:#0a0a0a; --dark2:#141414; --line:rgba(200,169,110,.3); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans TC', sans-serif; background:var(--dark); color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .card {
    width:100%; max-width:440px; background:var(--dark2);
    border:1px solid var(--line); border-radius:16px; padding:36px 28px;
  }
  .eyebrow { color:var(--gold); font-size:15px; font-weight:700; letter-spacing:4px; text-align:center; margin-bottom:10px; }
  h1 { font-size:26px; font-weight:900; text-align:center; line-height:1.4; margin-bottom:6px; }
  .hint { font-size:18px; color:rgba(255,255,255,.85); text-align:center; margin:18px 0 26px; line-height:1.7; }
  label { display:block; font-size:18px; font-weight:700; color:var(--gold); margin:18px 0 8px; }
  input {
    width:100%; padding:15px 16px; font-size:19px; font-family:inherit; font-weight:500;
    background:#0f0f0f; color:#fff; border:1px solid var(--line); border-radius:10px; outline:none;
  }
  input:focus { border-color:var(--gold); }
  .error {
    background:rgba(180,50,50,.15); border:1px solid rgba(220,80,80,.6); color:#ff9b9b;
    font-size:18px; font-weight:700; padding:12px 16px; border-radius:10px; margin-bottom:6px; text-align:center;
  }
  button {
    width:100%; margin-top:30px; padding:17px; font-size:21px; font-weight:900; font-family:inherit;
    color:var(--dark); background:var(--gold); border:none; border-radius:10px; cursor:pointer;
    letter-spacing:6px; transition:.25s;
  }
  button:hover { filter:brightness(1.12); transform:translateY(-1px); }
  .foot { text-align:center; color:rgba(255,255,255,.45); font-size:15px; margin-top:22px; line-height:1.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">歡迎蒞臨</div>
    <h1>{{ event.name }}</h1>
    <p class="hint">🎉 我要現場參加抽獎<br>輸入手機號碼，送出後立即進入LINE完成登記</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>手機號碼</label>
      <input type="tel" name="phone" value="{{ phone }}" placeholder="09xxxxxxxx" required inputmode="numeric" autofocus>
      <button type="submit">🎉 我要參加抽獎</button>
    </form>
    <p class="foot">查無報名資料的話，會引導您補填一次基本資料</p>
  </div>
</body>
</html>
