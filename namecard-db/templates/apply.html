<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申請跟進權限｜AI資源媒合系統</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; max-width: 400px; margin: 60px auto; padding: 16px; background: #f7f6f2; color: #222; }
  h1 { font-size: 19px; margin-bottom: 4px; text-align: center; }
  .subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 24px; }
  .box { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; color: #666; font-weight: 700; margin: 12px 0 4px; }
  input { width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
  button { width: 100%; padding: 13px; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; background: #1f3a5f; color: white; margin-top: 18px; }
  .error { background: #fdecea; color: #b3261e; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .success { background: #e6f6ea; color: #1e7d34; padding: 16px; border-radius: 10px; font-size: 14px; line-height: 1.6; }
  .back { display: block; text-align: center; margin-top: 16px; color: #1f3a5f; font-size: 14px; }
</style>
</head>
<body>
<h1>🙋 申請跟進權限</h1>
<div class="subtitle">使用AI資源媒合系統（查詢/媒合/跟進）需要教練審核過的帳號</div>

{% if submitted %}
<div class="box">
  <div class="success">
    ✅ 已送出申請！<br><br>
    {% if note %}{{ note }}{% else %}
    請等待大樹教練審核，核准後即可用「行動電話」登入，密碼統一是 <b>88888</b>。
    {% endif %}
  </div>
</div>
{% else %}
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="box">
  <form method="POST">
    <label>您的姓名</label>
    <input type="text" name="display_name" required autofocus>
    <label>行動電話（就是您的登入帳號）</label>
    <input type="tel" name="mobile" required>
    <div style="font-size:12px;color:#888;margin-top:4px;">核准後登入密碼統一是 88888</div>
    <button type="submit">送出申請</button>
  </form>
</div>
{% endif %}
<a class="back" href="/team/login">← 已經有帳號？回登入頁</a>
</body>
</html>
