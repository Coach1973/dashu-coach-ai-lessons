<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上傳完成｜名片上傳</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f7f6f2; color: #222; }
  .box { background: white; border-radius: 12px; padding: 26px 22px; margin-top: 40px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .icon { font-size: 44px; margin-bottom: 10px; }
  .headline { font-size: 19px; font-weight: 900; margin-bottom: 8px; }
  .desc { color: #666; font-size: 14px; line-height: 1.7; }
  .skipped { margin-top: 14px; font-size: 13px; color: #b3261e; background: #fdecea; padding: 10px 14px; border-radius: 8px; text-align: left; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .actions a { flex: 1; min-width: 100px; text-align: center; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; }
  .btn-primary { background: #1f3a5f; color: white; }
  .btn-secondary { background: white; color: #1f3a5f; border: 1px solid #1f3a5f; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📥</div>
  {% if saved_count > 0 %}
  <div class="headline">已收到 {{ saved_count }} 張名片</div>
  <div class="desc">AI 正在後台慢慢辨識，不用等在這頁——過一會兒回搜尋首頁，辨識完的名片會自動出現，還在處理中的會標示「處理中」。</div>
  {% else %}
  <div class="headline">沒有成功收到任何名片</div>
  <div class="desc">請確認選的是圖片檔（JPG／PNG／HEIC）</div>
  {% endif %}
  {% if skipped %}
  <div class="skipped">以下 {{ skipped|length }} 個檔案格式不支援，已略過：{{ skipped|join("、") }}</div>
  {% endif %}
  <div class="actions">
    <a class="btn-primary" href="/upload">再上傳一批</a>
    <a class="btn-secondary" href="/">回搜尋首頁</a>
  </div>
</div>
</body>
</html>
