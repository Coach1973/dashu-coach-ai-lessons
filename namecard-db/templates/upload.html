<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名片上傳辨識</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: #f7f6f2; color: #222; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
  .box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .dropzone { border: 2px dashed #c9c4b8; border-radius: 10px; padding: 28px 16px; text-align: center; color: #888; margin-bottom: 16px; }
  input[type=file] { width: 100%; font-size: 15px; padding: 10px 0; }
  .preview { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
  button { width: 100%; padding: 13px; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; background: #1f3a5f; color: white; margin-top: 8px; }
  button:disabled { background: #aab3bf; }
  .error { background: #fdecea; color: #b3261e; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .hint { font-size: 12px; color: #999; margin-top: 10px; line-height: 1.6; }
  .back { display: block; text-align: center; margin-top: 18px; color: #1f3a5f; font-size: 14px; }
  .loading { display: none; text-align: center; padding: 20px 0; color: #666; }
  .loading.show { display: block; }
</style>
</head>
<body>
<h1>📇 名片上傳辨識</h1>
<div class="subtitle">拍一張或多張名片照片，AI 幫你辨識姓名、公司、電話等資訊，辨識結果會收錄進大樹教練的名片資料庫，用於後續產業媒合。</div>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<div class="box">
  <form id="uploadForm" method="POST" action="/upload" enctype="multipart/form-data">
    <div class="dropzone">📸 點擊選擇名片照片（可一次選多張，最多 5 張）</div>
    <input type="file" name="photos" accept="image/*" multiple required id="fileInput">
    <div class="preview" id="preview"></div>
    <button type="submit" id="submitBtn">開始辨識</button>
    <div class="hint">支援 JPG / PNG / HEIC，單檔上限 15MB。辨識過程約需 10~30 秒，請耐心等候。</div>
  </form>
  <div class="loading" id="loading">⏳ AI 辨識中，請稍候…</div>
</div>

<a class="back" href="/">← 回名片搜尋首頁</a>

<script>
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  fileInput.addEventListener('change', () => {
    preview.innerHTML = '';
    [...fileInput.files].slice(0, 5).forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  });
  document.getElementById('uploadForm').addEventListener('submit', () => {
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('loading').classList.add('show');
  });
</script>
</body>
</html>
